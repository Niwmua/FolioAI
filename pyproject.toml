[project]
name = "folioai"
version = "0.1.0"
description = "Faithful book translation pipeline: PDF in, verified translation out."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "openai>=1.51",
    "pymupdf>=1.24",
    "lingua-language-detector>=2.0",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
render = [
    "ebooklib>=0.18",
    "python-docx>=1.1",
    "weasyprint>=62.0",
    "pillow>=12.0",
]
tokens = ["tiktoken>=0.7"]
# The `ml` extra (marker/docling) arrives in milestone 8; see DECISIONS D-06.

[project.scripts]
folioai = "folioai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "reportlab>=4.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folioai"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PTH", "ARG"]
ignore = [
    "B008",   # typer relies on function-call defaults
    "RUF001", # ambiguous unicode is deliberate: this is a translation tool
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["fitz.*", "pymupdf.*", "lingua.*", "slugify.*", "reportlab.*"]
ignore_missing_imports = true

# PyMuPDF ships type hints but leaves most of its API untyped. Relaxing this one check for
# the three modules that talk to it beats sprinkling casts through the extractors; every
# other strict check still applies to them.
[[tool.mypy.overrides]]
module = ["folioai.extract.pymupdf", "folioai.extract.probe", "folioai.extract.poppler"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits a real LLM endpoint; deselected by default",
]
addopts = "-m 'not live' --strict-markers"
filterwarnings = ["error::DeprecationWarning:folioai.*"]
